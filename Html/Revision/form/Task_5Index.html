<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5</title>
    <link rel="stylesheet" href="Task_5Style.css">
  </head>
  <body>
    <fieldset class="main">
      <h3>APPLICATION FORM</h3>
      <fieldset class="field1">
        <legend>Personal Details</legend>
        <label for="Applicant's">Applicant's full name:</label>
        <select>
          <option value="select">select</option>
          <option value="mr">Mr.</option>
          <option value="mrs">Mrs.</option>
        </select>
        <input type="text" name="Applicant" id="Applicant" />

        <br /><br />

        <label for="fatherName">Father's name:</label>
        <select>
          <option value="mr">Mr.</option>
          <option value="mrs">Mrs.</option>
        </select>
        <input type="text" name="Applicant" id="Applicant" />

        <br /><br />

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" /><span>Male</span>
        <input type="radio" name="gender" id="Female" /><span>Female</span>
        <input type="radio" name="gender" id="other" /><span>Other</span>

        <br /><br />

        <label for="maritalStatus">Marital Status:</label>
        <select>
          <option value="select">select</option>
          <option value="good">Good</option>
          <option value="bad">Bad</option>
        </select>

        <br><br>

        <label for="Handicapped">Handicapped:</label>
        <input type="radio" name="Handicapped" id="yes" /><span>yes</span>
        <input type="radio" name="Handicapped" id="no" /><span>No</span>

        <br><br>

        <label for="EWS">EWS:</label>
        <input type="radio" name="EWS" id="yes" /><span>yes</span>
        <input type="radio" name="EWS" id="no" /><span>No</span>

        <br><br>

        <label for="careof">Care Of</label>
        <input type="radio" name="careof" id="Parents"><span>Parents</span>
        <input type="radio" name="careof" id="Guardian"><span>Guardian</span>

        <br><br>

        <label for="motherName">Mother's name:</label>
        <select>
          <option value="mr">Mr.</option>
          <option value="mrs">Mrs.</option>
        </select>
        <input type="text" name="Applicant" id="Applicant" />

        <br /><br />

        <label for="dateOfBirth">Date Of Birth:</label>
        <input type="date" name="dateOfBirth" id="dateOfBirth">

        <br><br>

        <label for="category">Category</label>
        <select>
            <option value="--select--">--select--</option>
            <option value="middel">Middel Class</option>
            <option value="high">high class</option>
        </select>

        <br><br>

        <label for="Ex-seaviceman">Ex-seaviceman:</label>
        <input type="radio" name="Ex-seaviceman" id="yes" /><span>yes</span>
        <input type="radio" name="Ex-seaviceman" id="no" /><span>No</span>

        <br><br>

        <label for="religion">Religion:</label>
        <select>
            <option value="--select--">--select--</option>
            <option value="middel">Middel Class</option>
            <option value="high">high class</option>
        </select>


      </fieldset>
    </fieldset>
  </body>
</html>

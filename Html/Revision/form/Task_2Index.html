      <fieldset>
        <form>

        <label for="lastName">Last Name:</label>
        <input type="text" name="lastName" id="lastName">
        
        <br><br>

        <label for="compaanyNmae">compaanyNmae Address:</label>
        <input type="compaanyNmae" name="compaanyNmae" id="compaanyNmae">
        
        <br><br>

        <label for="DeliveryDate">preferred:</label>
        <input type="date" name="DeliveryDate" id="DeliveryDate">

        <br><br>

      </form>

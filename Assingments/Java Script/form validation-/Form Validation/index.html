<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment - Form Submission & Reading Form Values</title>
  </head>
  <body>
    <h1>Assignment 1</h1>
    <h2>RICR Student Registration Form</h2>
    <br />
    <form id="studentForm">
      <div>
        <label for="fullName">Full name: </label>
        <input type="text" name="fullName" id="fullName" />
      </div>
      <br /><br />

      <div>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" />
      </div>
      <br /><br />

      <div>
        <label for="coursName">Course Name: </label>
        <input type="text" name="coursName" id="coursName" />
      </div>
      <br /><br />

      <button type="submit">Submit</button>
    </form>

    <!-- Assingment 2 -->

    <h1>Assignment 2</h1>
    <h2>RICR Course Enquiry Form Using FormData</h2>
    <form id="courseEnquiryForm">
      <div>
        <label for="fullName">Full name: </label>
        <input type="text" name="fullName" id="fullName" />
      </div>
      <br /><br />

      <div>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" />
      </div>
      <br /><br />

      <div>
        <label for="phoneNumber">Phone number: </label>
        <input type="number" name="phoneNumber" id="phoneNumber">
      </div>
      <br><br>

      <div>
        <label for="interestedCourse">Interested course: </label>
        <input type="text" name="interestedCourse" id="interestedCourse" />
      </div>
      <br /><br />

      <button type="submit">Submit</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>

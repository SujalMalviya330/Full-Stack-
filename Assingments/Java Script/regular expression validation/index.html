<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Assingment 1</h1>
    <h2>RICR Student Registration Validator</h2>

    <form id="StudentForm">
      <div>
        <label for="userName">User name: </label>
        <input type="text" name="userName" id="userName" />
      </div>
      <br /><br />

      <div>
        <label for="email">Email: </label>
        <input type="email" name="email" id="email" />
      </div>
      <br /><br />

      <div>
        <label for="phoneNo">Phone number: </label>
        <input type="number" name="phoneNo" id="phoneNo" />
      </div>
      <br /><br />

      <button type="submit">Submit</button>
    </form>

    <h1>Assingment 2</h1>
    <h2>RICR Course Access Code Checker</h2>

    <form id="StudentForm2">
      <div>
        <label for="courseCode">Course code: </label>
        <input type="text" name="courseCode" id="courseCode" />
      </div>
      <br /><br />

      <div>
        <label for="nocode">No. code: </label>
        <input type="number" name="nocode" id="nocode" />
      </div>
      <br /><br />

      <div>
        <label for="message">Message: </label>
        <input type="text" name="message" id="message" />
      </div>
      <br /><br />

      <!-- <div>
        <label for="phoneNo">Phone number: </label>
        <input type="number" name="phoneNo" id="phoneNo" />
      </div> -->
      <br /><br />

      <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>

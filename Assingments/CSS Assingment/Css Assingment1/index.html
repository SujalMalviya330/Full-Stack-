<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="main">
      <section class="sec1">
        <div class="first-box">
          <h3><u>Lo</u>gin</h3>
          <div class="emali">
            <label for="email"
              ><img
                src="https://png.pngtree.com/png-clipart/20191120/original/pngtree-email-icon-png-image_5065641.jpg"
                height="15px"
                width="15px"
                alt="photo"
            /></label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Enter your email"
            />

            <br /><br />
          </div>
          <div class="password">
            <label for="password"
              ><img
                src="https://www.pinclipart.com/picdir/middle/130-1303682_security-password-2-icon-password-icon-in-png.png"
                height="15px"
                width="15px"
                alt="password"
            /></label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Conform a password"
            />
          </div>

          <br /><br />
          <hr />
          <br />
          <div class="remember">
            <div>
              <input type="checkbox" name="remember" id="RememberMe" /><span
                >Remember me</span
              >
            </div>
            <div><p class="forget-password">forget password?</p></div>
          </div>

          <br /><br />

          <button class="loginbtn">Login Now</button>
          <br /><br />
          <div class="footer">
            <p>don't have an account?</p>
            <p class="sing">singup now</p>
          </div>
        </div>
      </section>

      <section class="section2">
        <div class="first-box">
          <h3><u>Re</u>gistration</h3>
          <div class="name">
            <label for="userName"
              ><img
                src="https://static.vecteezy.com/system/resources/previews/020/911/740/original/user-profile-icon-profile-avatar-user-icon-male-icon-face-icon-profile-icon-free-png.png"
                alt="name"
                width="15px"
                height="15"
            /></label>
            <input
              type="text"
              name="userName"
              id="userName"
              placeholder="Enter your name"
            />
          </div>

          <br /><br />

          <div class="emali">
            <label for="email"
              ><img
                src="https://png.pngtree.com/png-clipart/20191120/original/pngtree-email-icon-png-image_5065641.jpg"
                height="15px"
                width="15px"
                alt="photo"
            /></label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Enter your email"
            />
          </div>

          <br /><br />

          <div class="createPassword">
            <label for="createPassword"
              ><img
                src="https://www.pinclipart.com/picdir/middle/130-1303682_security-password-2-icon-password-icon-in-png.png"
                height="15px"
                width="15px"
                alt="password"
            /></label>
            <input
              type="Password"
              name="createPassword"
              id="createPassword"
              placeholder="Create a password"
            />
          </div>

          <br /><br />

          <div class="password">
            <label for="password"
              ><img
                src="https://www.pinclipart.com/picdir/middle/130-1303682_security-password-2-icon-password-icon-in-png.png"
                height="15px"
                width="15px"
                alt="password"
            /></label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Conform a password"
            />
          </div>

          <br /><br />
          <hr />
          <br />

          <div class="condition">
            <input type="checkbox" name="condition" id="allCondition" /><span
              >I accept all term & condition</span
            >
          </div>

          <br /><br />

          <button class="restartbtn">Restart Now</button>
          <br /><br />
          <div class="footer">
            <p>Already have an account?</p>
            <p class="sing">login now</p>
          </div>
        </div>
      </section>
    </section>
  </body>
</html>

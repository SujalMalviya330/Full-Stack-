<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container-fluid bg-primary text-center p-2 text-light">
        <h1 class="fs-3 fw-semibold">My Todo List</h1>
        <h3 class="fs-6">Organize your day , one task at a time.</h3>
      </div>
    </header>
    <main>
      <section>
        <div class="container mt-3 p-4 border rounded shadow d-flex gap-3">
          <input
            type="text "
            name="newTask"
            id="taskInput"
            placeholder="Enter a new task........."
            class="form-control"
          />
          <button
            class="btn btn-primary text-nowrap"
            id="addTask"
            onclick="addTask()"
          >
            Add Task
          </button>
        </div>
      </section>

      <section>
        <div class="container mt-3 p-4 border rounded shadow">
          <ol class="w-100" id="taskList">
            <!-- <li class="p-3 d-flex justify-content-between">
              <div><input type="checkbox" class="me-3"><span>Task</span></div>
              <div class="button">
                <button class="btn btn-primary btn-sm">Edit</button>
                <button class="btn btn-danger btn-sm">Delete</button>
              </div>
            </li> -->

            
          </ol>
        </div>
      </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>

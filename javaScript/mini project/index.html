<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container-fluid bg-primary text-center p-2 text-light">
        <h1 class="fs-3 fw-semibold">My Todo List</h1>
        <h3 class="fs-6">Organize your day , one task at a time.</h3>
      </div>
    </header>
    <main>
      <section class="section1">
        <div class="container mt-3 p-4 border rounded shadow d-flex gap-3">
          <input
            type="text"
            name="newTask"
            id="taskInput"
            placeholder="Enter a new task..."
            class="form-control"
          />

          <button
            class="btn btn-primary text-nowrap"
            id="addTask"
            onclick="addTask()"
          >
            Add Task
          </button>
        </div>
      </section>

      <section class="section2">
        <div class="container mt-3 p-4 border rounded shadow">
          <div class="row border rounded m-0 w-100 fw-semibold" id="sec2Div">
            <div class="col-4 text-center py-3 border-end">
              <span class="fs-2 fw-semibold" id="totalTask">0</span>

              <br />

              Total Tasks
            </div>

            <div class="col-4 text-center py-3 border-end">
              <span class="fs-2 fw-semibold text-success" id="complete">0</span>

              <br />

              Completed
            </div>

            <div class="col-4 text-center py-3">
              <span class="fs-2 fw-semibold text-danger" id="pending">0</span>

              <br />

              Pending
            </div>
          </div>
        </div>
      </section>

      <section class="section3">
        <div class="container mt-3 p-4 border rounded shadow">
          <ol class="list-group list-group-numbered" id="taskList"></ol>
        </div>
      </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Todo List</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
>

<link rel="stylesheet" href="style.css">

</head><body><header class="bg-primary text-white text-center p-3">
    <h1 class="fs-3 fw-semibold">My Todo List</h1>
    <p class="mb-0">Organize your day, one task at a time.</p>
</header>

<main class="main-container">

    <section class="section1">
        <div class="container mt-4 p-3 p-md-4 border rounded shadow-sm bg-white">

            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    class="form-control"
                    maxlength="300"
                    aria-label="Enter a new task"
                >

                <button class="btn btn-primary" id="addTask" type="button">
                    Add Task
                </button>
            </div>

        </div>
    </section>

    <section class="section2">
        <div class="container mt-4 p-3 p-md-4 border rounded shadow-sm bg-white">

            <div class="row stats-row border rounded m-0" id="sec2Div">

                <div class="col-4 text-center py-3 border-end">
                    <span class="stat-number" id="totalTask">0</span>
                    <p class="stat-label mb-0">Total Tasks</p>
                </div>

                <div class="col-4 text-center py-3 border-end">
                    <span class="stat-number text-success" id="complete">0</span>
                    <p class="stat-label mb-0">Completed</p>
                </div>

                <div class="col-4 text-center py-3">
                    <span class="stat-number text-danger" id="pending">0</span>
                    <p class="stat-label mb-0">Pending</p>
                </div>

            </div>

        </div>
    </section>

    <section class="section3">
        <div class="container mt-4 mb-4 p-3 p-md-4 border rounded shadow-sm bg-white">

            <h2 class="fs-5 fw-semibold mb-3">My Tasks</h2>

            <ol class="list-group list-group-numbered" id="taskList"></ol>

            <p id="emptyMessage" class="text-secondary text-center py-3 mb-0">
                No tasks yet. Add your first task!
            </p>

        </div>
    </section>

</main>

<script src="script.js"></script>

</body></html>
